<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | MILEVIEEN Demo</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Optional custom CSS -->
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MILEVIEEN</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="login-demo.html">Login</a>
      </li>
    </ul>
  </div>
</nav>

<div class="login-wrapper" style="margin-top:120px;">
  <div class="login-card">

    <h3 class="text-center mb-4">Signup</h3>

    <!-- STATIC DEMO FORM -->
    <form onsubmit="return false;">

      <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-control" placeholder="demo_user">
      </div>

      <div class="form-group mt-3">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="demo@email.com">
      </div>

      <div class="form-group mt-3">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="********">
      </div>

      <div class="form-group mt-3">
        <label>Confirm Password</label>
        <input type="password" class="form-control" placeholder="********">
      </div>

      <button class="btn btn-primary w-100 mt-4">
        Create Account
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted">
        Demo only – backend disabled
      </span>
    </div>

  </div>
</div>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
